name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_DIR: kernel_source  # 如果你的内核文件夹叫别的，请在这里修改

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取代码
    - name: Checkout
      uses: actions/checkout@v4

    # 2. 安装 Clang (使用稳定的 apt 安装，避免 400 错误)
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y clang llvm lld bc

    # 3. 开始编译
    - name: Build Kernel with KSU
      run: |
        # 进入内核源码目录
        cd ${{ env.KERNEL_DIR }}
        
        # 清理旧配置
        rm -f .config
        
        # 生成通用 arm64 配置
        make LLVM=1 LLVM_I=1 ARCH=arm64 defconfig

        # 开启 KSU 核心选项
        ./scripts/config --file .config \
          -e KPROBES \
          -e KPROBE_EVENTS \
          -e KSU_KPROBE_HOOKS \
          -e KSU
          
        # 应用更改
        make LLVM=1 LLVM_I=1 ARCH=arm64 olddefconfig

        # 验证 KSU 是否开启
        echo "=== 检查 KSU 配置 ==="
        grep CONFIG_KSU .config

        # 开始编译 Image.gz-dtb
        make LLVM=1 LLVM_I=1 ARCH=arm64 -j$(nproc) Image.gz-dtb

    # 4. 打包 AnyKernel3
    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
        cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz-dtb ak3/
        cd ak3
        zip -r9 ../kernel-ksu.zip * -x .git README.md

    # 5. 上传成品
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-KSU
        path: kernel-ksu.zip
