name: Build lemonade A14 5.4 + KSU-Next

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install deps & Clang 14 (apt 官方源，无 400 错误)
      run: |
        sudo apt update
        sudo apt install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev \
          cpio gzip bzip2 zstd git curl python3 \
          clang lld llvm
        # 确认版本（ubuntu-22.04 默认就是 clang 14）
        clang --version
        ld.lld --version

    - name: Clone kernel source
      run: |
        git clone --depth=1 -b oneplus/sm8350_u_14.0.0_oneplus9 https://gitlab.com/OnePlusOSS/android_kernel_oneplus_sm8350 kernel
        cd kernel
        head -5 Makefile
        echo "KERNEL_DIR=$PWD" >> $GITHUB_ENV

    - name: Integrate KSU-Next (legacy, 5.4)
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

    - name: Defconfig + KSU config
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        # 优先尝试 lahaina_QGKI.config，找不到就退回通用 defconfig
        if [ -f "arch/arm64/configs/vendor/lahaina_QGKI.config" ]; then
          echo "✅ Using vendor/lahaina_QGKI.config"
          make LLVM=1 LLVM_I=1 ARCH=arm64 vendor/lahaina_QGKI.config
        else
          echo "⚠️ vendor/lahaina_QGKI.config not found, falling back to defconfig"
          make LLVM=1 LLVM_I=1 ARCH=arm64 defconfig
        fi

        # 开启 KSU 四项
        ./scripts/config --file .config \
          -e KPROBES \
          -e KPROBE_EVENTS \
          -e KSU_KPROBE_HOOKS \
          -e KSU
        make LLVM=1 LLVM_I=1 ARCH=arm64 olddefconfig

        # 确认 KSU 写入成功
        echo "=== KSU Config Check ==="
        grep -E "CONFIG_KSU|CONFIG_KPROBES" .config | grep -v "^#"

    - name: Build Image.gz-dtb
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        make LLVM=1 LLVM_I=1 ARCH=arm64 -j$(nproc) Image.gz-dtb

    - name: Package AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
        cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz-dtb ak3/
        cd ak3
        zip -r9 ../lemonade-a14-ksunext.zip * -x .git README.md

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: lemonade-a14-ksunext
        path: lemonade-a14-ksunext.zip
