name: 构建柠檬水 A14 (5.4 + KSU-Next)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  KERNEL_DIR: kernel

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: 'true'  # 关键：这里设置为 true，让 Actions 自动拉取子模块
          fetch-depth: 0

      - name: 安装依赖 & Clang
        run: |
          sudo apt update
          sudo apt install -y clang llvm lld make bc zip

      - name: 设置 Clang
        run: |
          # 定义重试次数
          max_retries=5
          retry_count=0
          success=false

          while [ $retry_count -lt $max_retries ]; do
            echo "第 $((retry_count + 1)) 次尝试下载 Clang..."
            
            # 使用 apt 安装 clang，不再使用容易 400 报错的 curl 脚本
            if sudo apt install -y clang llvm lld; then
              echo "Clang 安装成功！"
              success=true
              break
            else
              echo "安装失败，等待 10 秒后重试..."
              retry_count=$((retry_count + 1))
              sleep 10
            fi
          done

          if [ "$success" = false ]; then
            echo "::error::Clang 安装彻底失败！"
            exit 1
          fi

      - name: Defconfig + KSU config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # 1. 清理旧的 .config，避免缓存干扰
          rm -f .config
          
          # 2. 生成默认配置
          # 注意：如果你的 defconfig 文件名不同，请在这里修改
          make LLVM=1 LLVM_I=1 ARCH=arm64 defconfig

          # 3. 开启 KSU 核心功能
          ./scripts/config --file .config \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU_KPROBE_HOOKS \
            -e KSU
          
          # 4. 更新配置
          make LLVM=1 LLVM_I=1 ARCH=arm64 olddefconfig

          echo "=== KSU Config Check ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES" .config | grep -v "^#"

      - name: Build Image.gz-dtb
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make LLVM=1 LLVM_I=1 ARCH=arm64 -j$(nproc) Image.gz-dtb

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          zip -r9 ../lemonade-a14-ksunext.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lemonade-a14-ksunext
          path: lemonade-a14-ksunext.zip
