name: Build lemonade A14 (5.4 + KSU-Next)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  KERNEL_DIR: kernel
  KERNEL_CONFIG: vendor/lahaina_QGKI.config  # 针对这棵 OSS 树，用 lahaina 基础配置
  KSU_VERSION: next
  LLVM_VERSION: 14

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Clang/Make version
        run: |
          clang --version
          make --version

      - name: Setup Clang ($LLVM_VERSION)
        run: |
          echo "正在下载 Clang r450784d..."
          # 使用国内镜像源并增加重试机制
          for i in 1 2 3; do
            if wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/master/clang-r450784d.tar.gz?format=TEXT | base64 -d > clang.tar.gz && tar -xzf clang.tar.gz && rm clang.tar.gz; then
              echo "Clang 下载成功！"
              break
            else
              echo "第 $i 次下载失败，重试中..."
              rm -f clang.tar.gz
              sleep 5
            fi
          done
          
          if [ ! -d "clang-r450784d" ]; then
            echo "::error::Clang 下载彻底失败，请检查网络！"
            exit 1
          fi
          
          # 将 bin 和 libexec 目录添加到 PATH
          export PATH=$PWD/clang-r450784d/bin:$PATH
          export LD_LIBRARY_PATH=$PWD/clang-r450784d/lib:$LD_LIBRARY_PATH
          echo "PATH=$PATH" >> $GITHUB_ENV
          clang --version

      - name: Defconfig + KSU config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/opt/clang/bin:$PATH"
          
          # 1. 生成默认配置
          # 优先尝试 lahaina_QGKI，如果没有则退回通用配置
          if [ -f "arch/arm64/configs/${{ env.KERNEL_CONFIG }}" ]; then
            make LLVM=1 LLVM_I=1 ARCH=arm64 ${{ env.KERNEL_CONFIG }}
          else
            echo "⚠️ 未找到 ${{ env.KERNEL_CONFIG }}，使用默认 defconfig..."
            make LLVM=1 LLVM_I=1 ARCH=arm64 defconfig
          fi

          # 2. 开启 KSU 和相关调试配置
          ./scripts/config --file .config \
            -e KPROBES \
            -e KPROBE_EVENTS \
            -e KSU_KPROBE_HOOKS \
            -e KSU
          
          # 确认配置写入
          ./scripts/config --file .config --state KSU
          
          # 3. 更新配置
          make LLVM=1 LLVM_I=1 ARCH=arm64 olddefconfig

      - name: Build Image.gz-dtb
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="/opt/clang/bin:$PATH"
          make LLVM=1 LLVM_I=1 ARCH=arm64 -j$(nproc) Image.gz-dtb

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          zip -r9 ../lemonade-a14-ksunext.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lemonade-a14-ksunext
          path: lemonade-a14-ksunext.zip
